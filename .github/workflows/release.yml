name: Release

on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and publish the version in plugin.json, unless it is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version .claude-plugin/plugin.json)
          tag="bogusz--v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Bogusz $version" --generate-notes
